<!doctype html>
<!-- The picture a link to the site shows when it's shared (og.png, 1200 by
     630), made by make.sh. The fonts are the site's own, filled in there. -->
<meta charset="utf-8" />
<style>
	@font-face {
		font-family: "Inter";
		src: url("{{INTER}}") format("woff2");
		font-weight: 100 900;
	}
	@font-face {
		font-family: "Newsreader";
		src: url("{{NEWSREADER}}") format("woff2");
		font-weight: 200 800;
	}
	html,
	body {
		margin: 0;
	}
	.card {
		box-sizing: border-box;
		display: flex;
		flex-direction: column;
		width: 1200px;
		height: 630px;
		padding: 84px 96px 76px;
		color: #1d1d1f;
		background:
			radial-gradient(900px 420px at 92% 108%, rgb(245 158 11 / 0.14), transparent 70%),
			#fff;
		font-family: "Inter", sans-serif;
	}
	.name {
		display: flex;
		align-items: center;
		gap: 20px;
		font-size: 34px;
		font-weight: 600;
		letter-spacing: -0.01em;
	}
	.name svg {
		width: 52px;
	}
	h1 {
		margin: auto 0 0;
		font: 500 104px/1.02 "Newsreader", serif;
		letter-spacing: -0.02em;
	}
	p {
		margin: 22px 0 0;
		color: #6e6e73;
		font-size: 36px;
		line-height: 1.3;
		letter-spacing: -0.005em;
	}
	.domain {
		margin-top: auto;
		color: #c2410c;
		font-size: 26px;
		font-weight: 500;
	}
</style>
<div class="card">
	<div class="name">
		<svg viewBox="0 0 22 18">
			<defs>
				<linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
					<stop offset="0" stop-color="#f59e0b" />
					<stop offset="1" stop-color="#ea580c" />
				</linearGradient>
			</defs>
			<g fill="url(#g)">
				<rect x="0" y="0" width="22" height="4" rx="2" />
				<rect x="0" y="7" width="16" height="4" rx="2" />
				<rect x="0" y="14" width="10" height="4" rx="2" />
			</g>
		</svg>
		Human Tokens
	</div>
	<h1>Writing by people.</h1>
	<p>Your ideas, your thoughts, in your own words.</p>
	<div class="domain">human-tokens.dev</div>
</div>
